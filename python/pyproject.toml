[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "askamerica"
version = "0.62.0"
description = "Query US government data with a single line of Python"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [{ name = "AskAmerica", email = "support@askamerica.ai" }]
keywords = ["government", "data", "sql", "open-data", "sec", "census", "fec"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "requests>=2.28.0",
]

[project.optional-dependencies]
# Run queries via the govdata JDBC engine
engine = [
  "jpype1>=1.4.0",
  "pandas>=1.3.0",
  "jdk4py>=21.0.7.1; python_version>='3.10'",
]
# MCP server for Claude Desktop
mcp = [
  "jpype1>=1.4.0",
  "mcp>=1.0.0",
  "jdk4py>=21.0.7.1; python_version>='3.10'",
]
# Everything
all = [
  "jpype1>=1.4.0",
  "pandas>=1.3.0",
  "mcp>=1.0.0",
  "jdk4py>=21.0.7.1; python_version>='3.10'",
]

[project.urls]
Homepage = "https://askamerica.ai"
Documentation = "https://askamerica.ai/docs"
Issues = "https://github.com/askamerica/askamerica-python/issues"

[project.scripts]
askamerica = "askamerica.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["askamerica"]
# The unshaded engine jar-set is staged into askamerica/engine_jars/ at build time by
# CI (gradle :askamerica-engine:stageEngineRuntime). It is not git-tracked, so it must
# be listed as an artifact for hatchling to include it in the wheel. When absent (a
# source-only build), the package falls back to downloading the fat jar on first use.
artifacts = ["askamerica/engine_jars/**/*.jar"]
