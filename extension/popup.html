<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>AskAmerica Validate</title>
<style>
  body { width: 340px; margin: 0; font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #111; }
  header { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: linear-gradient(135deg, #1a3a8a 50%, #d5322f 50%); color: #fff; }
  header img { width: 24px; height: 24px; border-radius: 6px; }
  header h1 { font-size: 14px; margin: 0; font-weight: 600; }
  main { padding: 12px; }
  .url { font-size: 11px; color: #555; word-break: break-all; margin-bottom: 8px; }
  .status { font-size: 12px; color: #555; margin-bottom: 10px; }
  .status .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #999; margin-right: 6px; vertical-align: middle; }
  .status.ok .dot { background: #1b7f3b; }
  .status.down .dot { background: #c0272d; }
  button { width: 100%; padding: 9px 10px; margin: 4px 0; border: 1px solid #1a3a8a; background: #1a3a8a; color: #fff; border-radius: 6px; font-size: 13px; cursor: pointer; }
  button.secondary { background: #fff; color: #1a3a8a; }
  button.ghost { background: #fff; color: #444; border-color: #ccc; }
  .tally { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .pill { padding: 2px 8px; border-radius: 999px; color: #fff; font-size: 11px; font-weight: 600; }
  ol.claims { padding-left: 18px; margin: 6px 0 10px; max-height: 220px; overflow: auto; }
  ol.claims li { margin-bottom: 6px; }
  ol.claims .v { font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: .03em; }
  a { color: #1a3a8a; }
  footer { padding: 8px 12px; border-top: 1px solid #eee; font-size: 11px; color: #666; display: flex; justify-content: space-between; }
  .hint { font-size: 11px; color: #666; margin-top: 8px; }
</style>
</head>
<body>
<header><img src="icons/icon-48.png" alt=""><h1>AskAmerica Validate</h1></header>
<main>
  <div class="url" id="url"></div>
  <div class="status" id="status"><span class="dot"></span><span id="statusText">Checking engine…</span></div>
  <div id="result"></div>
  <button id="validateDesktop">Validate with AskAmerica</button>
  <button id="validateWeb" class="secondary">Validate with AskAmerica (claude.ai)</button>
  <button id="toggle" class="ghost" hidden>Hide highlights</button>
  <div class="hint">Opens your Claude session (Desktop, or claude.ai as fallback) with “Validate this article: …” staged for the AskAmerica connector. Press Enter to run it on your plan; the verdicts appear here and on the page when the report is published.</div>
</main>
<footer><a href="#" id="options">Options</a><span id="version"></span></footer>
<script src="common.js"></script>
<script src="popup.js"></script>
</body>
</html>
