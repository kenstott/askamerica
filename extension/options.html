<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>AskAmerica Validate — options</title>
<style>
  body { max-width: 560px; margin: 32px auto; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #111; }
  h1 { font-size: 18px; }
  label { display: block; margin: 14px 0 4px; font-weight: 600; }
  input[type=number] { width: 120px; padding: 6px; }
  .note { color: #555; font-size: 12px; }
  button { margin-top: 16px; padding: 8px 14px; background: #1a3a8a; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
  #saved { margin-left: 10px; color: #1b7f3b; }
</style>
</head>
<body>
<h1>AskAmerica Validate</h1>
<label for="port">Engine port</label>
<input type="number" id="port" min="1024" max="65535">
<div class="note">The AskAmerica engine serves verdicts on 127.0.0.1 at this port (default 45123, set with <code>-Daskamerica.claims.port</code> on the engine).</div>
<label><input type="checkbox" id="auto"> Highlight validated claims on the page automatically</label>
<button id="save">Save</button><span id="saved"></span>
<script src="common.js"></script>
<script>
  chrome.storage.sync.get({ enginePort: AA_DEFAULT_PORT, autoHighlight: true }, v => {
    document.getElementById("port").value = v.enginePort;
    document.getElementById("auto").checked = v.autoHighlight;
  });
  document.getElementById("save").addEventListener("click", () => {
    chrome.storage.sync.set({
      enginePort: parseInt(document.getElementById("port").value, 10) || AA_DEFAULT_PORT,
      autoHighlight: document.getElementById("auto").checked
    }, () => { document.getElementById("saved").textContent = "Saved"; setTimeout(() => document.getElementById("saved").textContent = "", 1500); });
  });
</script>
</body>
</html>
