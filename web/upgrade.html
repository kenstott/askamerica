<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AskAmerica — Upgrade</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#080b0f; --bg2:#0d1117; --border:#1e2d3d; --amber:#e8a24a; --amber-dim:#7a5120;
    --amber-glow:rgba(232,162,74,0.12); --green:#3fb950; --red:#f85149;
    --text:#cdd9e5; --text-dim:#768390; --white:#f0f6fc;
    --mono:'JetBrains Mono',monospace; --serif:'Instrument Serif',serif;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--mono);font-size:14px;line-height:1.7;
    min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:3rem 1.5rem}
  a{color:var(--amber);text-decoration:none}
  .wrap{width:100%;max-width:720px}
  .home{color:var(--text-dim);font-size:13px}
  h1{font-family:var(--serif);font-weight:400;color:var(--white);font-size:2.6rem;line-height:1.1;margin:1.5rem 0 .5rem}
  h1 em{font-style:italic;color:var(--amber)}
  .sub{color:var(--text-dim);margin-bottom:2rem}
  label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:6px}
  input{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:8px;
    padding:12px 16px;color:var(--white);font-family:var(--mono);font-size:14px;outline:none}
  input:focus{border-color:var(--amber-dim);box-shadow:0 0 0 3px var(--amber-glow)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:8px;
    font-family:var(--mono);font-size:13px;font-weight:500;cursor:pointer;border:none;background:var(--amber);color:#000}
  .btn:hover{opacity:.88}
  .btn-load{width:100%;margin-top:12px}
  .msg{color:var(--red);font-size:13px;margin-top:10px;min-height:18px}
  .plans{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;margin-top:2rem}
  .plan{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:24px;display:flex;flex-direction:column}
  .plan-name{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);margin-bottom:10px}
  .plan-price{font-family:var(--serif);font-size:2.4rem;color:var(--white);line-height:1}
  .plan-price span{font-family:var(--mono);font-size:13px;color:var(--text-dim)}
  .plan-quota{font-size:12px;color:var(--amber);margin:8px 0 20px}
  .plan a.cta{margin-top:auto;text-align:center;background:var(--amber);color:#000;padding:11px;border-radius:8px;font-weight:500;font-size:13px}
  .plan a.cta:hover{opacity:.88}
  .plan.featured{border-color:var(--amber-dim);background:linear-gradient(135deg,var(--bg2),rgba(232,162,74,0.05))}
</style>
</head>
<body>
<div class="wrap">
  <a class="home" href="/">← AskAmerica</a>
  <h1>Upgrade your <em>plan</em></h1>
  <p class="sub">Enter your API key to see your checkout options. You pay for data scanned, not seats.</p>

  <label for="key">API key</label>
  <input type="text" id="key" placeholder="aa_live_… or aa_free_…" autocomplete="off">
  <button class="btn btn-load" id="load" onclick="loadPlans()">Show plans →</button>
  <div class="msg" id="msg"></div>

  <div class="plans" id="plans"></div>
</div>

<script>
const API = 'https://api.askamerica.ai';

// Prefill from ?key= or a previously stored key.
const params = new URLSearchParams(location.search);
const stored = params.get('key') || localStorage.getItem('askamerica_api_key') || '';
if (stored) document.getElementById('key').value = stored;

async function loadPlans() {
  const key = document.getElementById('key').value.trim();
  const msg = document.getElementById('msg');
  const plansEl = document.getElementById('plans');
  const btn = document.getElementById('load');
  msg.textContent = '';
  plansEl.innerHTML = '';
  if (!key) { msg.textContent = 'Enter your API key.'; return; }

  btn.disabled = true; btn.textContent = 'Loading…';
  try {
    const res = await fetch(`${API}/v1/checkout`, { headers: { 'X-API-Key': key } });
    if (res.status === 401) { msg.textContent = 'Invalid API key.'; return; }
    if (!res.ok) { msg.textContent = 'Could not load plans. Try again.'; return; }
    const data = await res.json();
    localStorage.setItem('askamerica_api_key', key);

    const cards = [];
    if (data.starter) cards.push(card('Starter', data.starter, false));
    if (data.pro)     cards.push(card('Pro', data.pro, true));
    (data.prepaid || []).forEach(p => cards.push(card(`${p.quota_gb} GB pass`, p, false, true)));
    plansEl.innerHTML = cards.join('');
    if (!cards.length) msg.textContent = 'No upgrade options available for this key.';
  } catch (e) {
    msg.textContent = 'Network error. Try again.';
  } finally {
    btn.disabled = false; btn.textContent = 'Show plans →';
  }
}

function card(name, p, featured, oneTime) {
  const cadence = oneTime ? '' : '/mo';
  return `<div class="plan${featured ? ' featured' : ''}">
    <div class="plan-name">${name}</div>
    <div class="plan-price">$${p.price_usd}<span>${cadence}</span></div>
    <div class="plan-quota">${p.quota_gb} GB${oneTime ? ' — one-time' : ' / month'}</div>
    <a class="cta" href="${p.checkout_url}">Checkout →</a>
  </div>`;
}

document.getElementById('key').addEventListener('keydown', e => { if (e.key === 'Enter') loadPlans(); });
if (stored) loadPlans();
</script>
</body>
</html>
